; SwimTrack sender (wrist board) - PlatformIO build configuration
; Board: LOLIN S2 Mini (ESP32-S2). ESP-NOW is part of the ESP32 Arduino core,
; so no extra libraries are needed.

[env:lolin_s2_mini]
platform      = espressif32@7.0.1
board         = lolin_s2_mini
framework     = arduino
monitor_speed = 115200

; ESP32-S2 native USB CDC: maps Serial to the USB port.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
