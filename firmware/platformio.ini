; SwimTrack firmware - PlatformIO build configuration
;
;   pio run -e lolin_s2_mini      build the device firmware (LOLIN S2 Mini, ESP32-S2)
;   pio test -e native            run the host-side unit tests (no hardware needed)

[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform      = espressif32@7.0.1
board         = lolin_s2_mini
framework     = arduino
monitor_speed = 115200

; ESP32-S2 uses native USB CDC for Serial. ARDUINO_USB_MODE is already defined
; by the board definition, so only the CDC-on-boot flag is set here.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

; LittleFS ships with the ESP32 Arduino core, so only ArduinoJson is fetched.
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; Host build for the pure detection logic. Only the filter, stroke detector and
; lap counter sources are compiled; test/shim provides a minimal Arduino.h.
[env:native]
platform         = native@1.2.1
test_framework   = unity
test_build_src   = yes
build_src_filter =
    -<*>
    +<imu_filters.cpp>
    +<stroke_detector.cpp>
    +<stroke_detector_part2.cpp>
    +<lap_counter.cpp>
    +<lap_counter_part2.cpp>
build_flags =
    -std=gnu++17
    -I test/shim
    -D SWIMTRACK_NATIVE=1
    -D DEBUG_SERIAL=0
